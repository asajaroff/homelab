{{- if .Values.grafanaRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-grafana
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.grafanaRoute.gateway.name }}
      namespace: {{ .Values.grafanaRoute.gateway.namespace }}
  hostnames:
    - {{ .Values.grafanaRoute.host | quote }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}-grafana
          port: 80
{{- end }}
